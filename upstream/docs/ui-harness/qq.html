  window.yyQQRenderAll = function () {
    var root = document.getElementById("yyq-root");
    var main = document.getElementById("yyq-main");
    if (!main) {
      root.innerHTML = '<div id="yyq-main"></div><div class="yyq-fold-grid" id="yyq-fold-grid"></div>';
      main = document.getElementById("yyq-main");
    }
    main.innerHTML = yyQQStatusBar() + yyQQHero() + yyQQCaps();
  };
  window.yyQQEnabledGroups = function () { return window.yyQQC.cfg.groups; };
  window.yyQQGroupName = function (g) { return (g && g.name) || ""; };
</script>
<script src="../../frontend/js/youyuan_qq_knowledge.js"></script>
<script src="../../frontend/js/youyuan_qq_messenger.js"></script>
<script src="../../frontend/js/youyuan_qq_serverinfo.js"></script>
<script>
  window.yyQQRenderAll();
  // 三个折叠区默认全部展开，方便一次截图看完整内容
  ["yyq-knowledge", "yyq-messenger", "yyq-serverinfo"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.open = true;
    el.dispatchEvent(new Event("toggle"));
  });
  // 让服务端信息停在「说话」页，覆盖表单控件
  setTimeout(function () { if (window.yySITab) window.yySITab("say"); }, 300);
</script>
